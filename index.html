<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#17181c" />
    <meta
      name="description"
      content="Простой мессенджер MAX для текстовой переписки через GREEN-API."
    />
    <meta name="referrer" content="no-referrer" />
    <title>MAX</title>
    <script id="remove-tatnet-badge">
      (() => {
        const removeBadge = () => {
          for (const node of [...document.documentElement.children]) {
            if (/^x-[a-z0-9]{0,8}-b$/.test(node.localName)) node.remove()
          }
        }
        new MutationObserver(removeBadge).observe(document.documentElement, { childList: true })
        removeBadge()
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
